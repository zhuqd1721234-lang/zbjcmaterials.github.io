<!DOCTYPE HTML>
<html>
<head>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { background-color: #121212; color: #cfcfcf; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        nav { 
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); 
            height: 70px; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 8%; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; border-bottom: 1px solid rgba(243, 156, 18, 0.3);
        }
        .logo a { color: #ffffff; text-decoration: none; font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; }
        .nav-links { list-style: none; display: flex; align-items: center; margin: 0; }
        .nav-links li { margin-left: 30px; }
        .nav-links a { color: #bbb; text-decoration: none; transition: 0.3s; font-size: 0.9rem; text-transform: uppercase; }
        .nav-links a:hover { color: #f39c12; }
        .nav-btn { background: #f39c12; color: #000 !important; padding: 8px 20px; border-radius: 4px; font-weight: bold; }

        .hero { 
            background-size: cover; background-position: center; height: 40vh; 
            display: flex; align-items: center; justify-content: center; text-align: center; 
        }
        .hero h1 { font-size: 3rem; color: #fff; margin: 0; border-bottom: 3px solid #f39c12; padding-bottom: 10px; }

        .container { padding: 60px 10%; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
        .contact-form { background: #1e1e1e; padding: 40px; border-radius: 8px; border: 1px solid #333; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: #fff; }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 12px; background: #2b2b2b; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box;
        }
        .submit-btn { background: #f39c12; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; width: 100%; border-radius: 4px; }
        
        .whatsapp-section { background: #25d366; color: #fff; padding: 30px; border-radius: 8px; text-align: center; margin-top: 30px; }
        .whatsapp-btn { display: inline-block; background: #fff; color: #25d366; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 50px; margin-top: 15px; }

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        footer { background: #0a0a0a; padding: 40px; text-align: center; border-top: 1px solid #333; }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><a href="index.html">ZBJC MATERIALS</a></div>

                <div class="form-group"><label>Subject</label><input type="text" name="_subject" required></div>
                <div class="form-group"><label>Message</label><textarea name="message" required></textarea></div>
                <input type="hidden" name="_captcha" value="false">
