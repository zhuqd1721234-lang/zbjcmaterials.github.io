<!DOCTYPE HTML>
<html>
<head>
    <title>Contact Us | ZBJC Materials</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        body { background-color: #121212; color: #cfcfcf; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        nav { 
            background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(10px); 
            height: 70px; display: flex; justify-content: space-between; align-items: center; 
            padding: 0 8%; position: fixed; top: 0; left: 0; right: 0; z-index: 1000; border-bottom: 1px solid rgba(243, 156, 18, 0.3);
        }
        .logo a { color: #ffffff; text-decoration: none; font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; }
        .nav-links { list-style: none; display: flex; align-items: center; margin: 0; }
        .nav-links li { margin-left: 30px; }
        .nav-links a { color: #bbb; text-decoration: none; font-size: 0.9rem; text-transform: uppercase; }
        .nav-links a:hover { color: #f39c12; }
        .nav-btn { background: #f39c12; color: #000 !important; padding: 8px 20px; border-radius: 4px; font-weight: bold; }

        .hero-bg { 
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1504307651254-35680f356dfd?q=80&w=2000');
            background-size: cover; background-position: center; height: 40vh; 
            display: flex; align-items: center; justify-content: center; text-align: center; 
        }
        .hero-bg h1 { font-size: 3rem; color: #fff; margin: 0; border-bottom: 3px solid #f39c12; padding-bottom: 10px; }

        .container { padding: 60px 10%; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; }
        .contact-form { background: #1e1e1e; padding: 40px; border-radius: 8px; border: 1px solid #333; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; color: #fff; }
        .form-group input, .form-group textarea { 
            width: 100%; padding: 12px; background: #2b2b2b; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box;
        }
        .submit-btn { background: #f39c12; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; width: 100%; border-radius: 4px; }
        .whatsapp-section { background: #25d366; color: #fff; padding: 30px; border-radius: 8px; text-align: center; margin-top: 30px; }
        .whatsapp-btn { display: inline-block; background: #fff; color: #25d366; padding: 12px 25px; text-decoration: none; font-weight: bold; border-radius: 50px; margin-top: 15px; }

        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        footer { background: #0a0a0a; padding: 40px; text-align: center; border-top: 1px solid #333; }
        /* --- 顶级工程师修复：移动端适配代码开始 --- */
@media (max-width: 768px) {
    /* 1. 调整导航栏：防止菜单在手机上叠在一起 */
    nav {
        padding: 0 5%; /* 缩小导航栏左右内边距 */
        height: auto;
        flex-direction: column; /* 导航栏内容垂直排列 */
        padding-bottom: 10px;
    }
    .logo {
        margin-top: 10px;
        margin-bottom: 5px;
    }
    .nav-links {
        padding: 0;
        margin-bottom: 5px;
    }
    .nav-links li {
        margin-left: 15px; /* 缩小菜单之间的距离 */
    }
    .nav-links a {
        font-size: 0.75rem; /* 缩小文字大小 */
    }

    /* 2. 调整主体内容边距：防止内容被挤压或遮挡 */
    .container {
        padding: 40px 5% !important; /* 将左右 15% 的边距缩小为 5% */
        width: 100% !important;
        box-sizing: border-box; /* 确保边距不撑开宽度 */
    }

    /* 3. 调整大标题字号：防止标题过长超出屏幕 */
    .hero-bg h1, .hero h1 {
        font-size: 1.8rem !important; /* 缩小标题 */
        padding: 0 10px;
    }
    
    /* 4. 调整数据网格：手机上一列显示 */
    .stats-grid, .product-grid, .container {
        display: block !important; /* 强制块级排列 */
    }
    .stat-item {
        margin-bottom: 15px;
        width: 100%;
    }
    
    /* 5. 调整图片和盒子：确保不溢出 */
    img, .contact-form, .contact-info {
        width: 100% !important;
        max-width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
    }
    
    /* 6. 解决联系页面左右遮挡 */
    .container {
        display: flex !important;
        flex-direction: column !important; /* 强制上下排布 */
    }
}

/* 强制所有元素计算宽度时包含边距，防止溢出屏幕 */
* {
    box-sizing: border-box;
}
/* --- 移动端适配代码结束 --- */
    </style>
</head>
<body>
    <nav>
        <div class="logo"><a href="index.html">ZBJC MATERIALS</a></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="contact.html" class="nav-btn">Contact Us</a></li>
        </ul>
    </nav>

    <header class="hero-bg">
        <h1>GET A QUOTE</h1>
    </header>

    <div class="container">
        <div class="contact-form">
            <h2 style="color:#f39c12;">Email Inquiry</h2>
            <!-- 关键点：确保 Email 拼写完全正确 -->
            <form action="https://formsubmit.co/zhuqd1721234@gmail.com" method="POST">
                <!-- 重要：每个 input 必须有 name 属性 -->
                <div class="form-group">
                    <label>Your Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" required></textarea>
                </div>
                <!-- 提交后的跳转，防止留在报错页面 -->
                <input type="hidden" name="_next" value="https://www.zbjcmaterials.com/contact.html">
                <button type="submit" class="submit-btn">SEND TO FACTORY</button>
            </form>
        </div>

        <div class="contact-info">
            <h2 style="color:#f39c12;">Instant Chat</h2>
            <div class="whatsapp-section">
                <h3>WhatsApp B2B Solution</h3>
                <a href="https://wa.me/8615725817831" class="whatsapp-btn">Start Chat Now</a>
            </div>
            <div style="margin-top: 30px;">
                <!-- 这里的图片链接换成了一张极其稳定的图 -->
                <img src="https://images.unsplash.com/photo-1590480394626-821152a82a83?auto=format&fit=crop&q=80&w=800" 
                     style="width: 100%; border-radius: 8px; border: 1px solid #333;">
            </div>
        </div>
    </div>

    <footer><p>&copy; ZBJC Materials. All rights reserved.</p></footer>
</body>
</html>
